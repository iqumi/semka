<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeInfo - Anime Catalog</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div id="welcome-screen">
    <div class="welcome-container">
        <div class="welcome-content">
            <div class="welcome-header">
                <h1><i class="fas fa-film"></i> AnimeInfo</h1>
                <div class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
            <p class="welcome-text">Welcome to the world of anime!</p>
            <p class="welcome-subtitle">Discover thousands of anime series, movies and OVA</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Enter your name" />
                <button id="enter-button">
                    <span>Enter</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
        <div class="welcome-image">
            <div class="anime-particles"></div>
        </div>
    </div>
</div>

<div id="main-screen" class="hidden">
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-film"></i>
                <span>AnimeInfo</span>
            </div>
            <h2 id="greeting"></h2>
            <div class="theme-toggle">
                <i class="fas fa-moon"></i>
            </div>
        </div>
    </header>

    <main>
        <section class="controls-section">
            <div class="controls-container">
                <div class="search-filters">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Search anime..." />
                    </div>
                    <div class="filters-group">
                        <select id="filter-status">
                            <option value="">All Status</option>
                            <option value="airing">Airing</option>
                            <option value="completed">Completed</option>
                            <option value="upcoming">Upcoming</option>
                        </select>
                        <select id="filter-type">
                            <option value="">All Types</option>
                            <option value="tv">TV Series</option>
                            <option value="movie">Movie</option>
                            <option value="ova">OVA</option>
                            <option value="ona">ONA</option>
                            <option value="special">Special</option>
                        </select>
                        <select id="filter-year">
                            <option value="">All Years</option>
                        </select>
                        <select id="filter-genre">
                            <option value="">All Genres</option>
                        </select>
                    </div>
                </div>
                <div class="sort-buttons">
                    <button id="sort-by-score" class="sort-btn">
                        <i class="fas fa-star"></i>
                        By Score
                    </button>
                    <button id="sort-by-title" class="sort-btn">
                        <i class="fas fa-sort-alpha-down"></i>
                        By Title
                    </button>
                    <button id="sort-by-year" class="sort-btn">
                        <i class="fas fa-calendar"></i>
                        By Year
                    </button>
                    <button id="reset-filters" class="sort-btn reset-btn">
                        <i class="fas fa-undo"></i>
                        Reset
                    </button>
                </div>
            </div>
            <div class="stats-container">
                <p id="stats"></p>
            </div>
        </section>

        <div class="anime-grid" id="anime-grid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading anime...</p>
            </div>
        </div>

        <div class="pagination" id="pagination">
            <button id="prev-page" class="page-btn"><i class="fas fa-chevron-left"></i></button>
            <span id="page-info">Page 1</span>
            <button id="next-page" class="page-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </main>
</div>

<script type="module" src="main.js"></script>
</body>

</html>
