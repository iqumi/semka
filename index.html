<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeInfo - Каталог аниме</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<!-- Экран приветствия -->
<div id="welcome-screen">
    <div class="welcome-container">
        <div class="welcome-content">
            <div class="welcome-header">
                <h1><i class="fas fa-film"></i> AnimeInfo</h1>
                <div class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
            <p class="welcome-text">Добро пожаловать в мир аниме!</p>
            <p class="welcome-subtitle">Откройте для себя тысячи аниме-сериалов, фильмов и OVA</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Введите ваше имя" />
                <button id="enter-button">
                    <span>Войти</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
        <div class="welcome-image">
            <div class="anime-particles"></div>
        </div>
    </div>
</div>

<!-- Главный экран -->
<div id="main-screen" class="hidden">
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-film"></i>
                <span>AnimeInfo</span>
            </div>
            <h2 id="greeting"></h2>
            <div class="theme-toggle">
                <i class="fas fa-moon"></i>
            </div>
        </div>
    </header>

    <main>
        <!-- Панель управления -->
        <section class="controls-section">
            <div class="controls-container">
                <div class="search-filters">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Поиск аниме..." />
                    </div>
                    <div class="filters-group">
                        <select id="filter-status">
                            <option value="">Все статусы</option>
                            <option value="airing">Выходит</option>
                            <option value="completed">Завершено</option>
                            <option value="upcoming">Анонсировано</option>
                        </select>
                        <select id="filter-type">
                            <option value="">Все типы</option>
                            <option value="tv">TV Сериал</option>
                            <option value="movie">Фильм</option>
                            <option value="ova">OVA</option>
                            <option value="ona">ONA</option>
                            <option value="special">Спешл</option>
                        </select>
                        <select id="filter-year">
                            <option value="">Все годы</option>
                        </select>
                        <select id="filter-genre">
                            <option value="">Все жанры</option>
                        </select>
                    </div>
                </div>
                <div class="sort-buttons">
                    <button id="sort-by-score" class="sort-btn">
                        <i class="fas fa-star"></i>
                        По рейтингу
                    </button>
                    <button id="sort-by-title" class="sort-btn">
                        <i class="fas fa-sort-alpha-down"></i>
                        По названию
                    </button>
                    <button id="sort-by-year" class="sort-btn">
                        <i class="fas fa-calendar"></i>
                        По году
                    </button>
                    <button id="reset-filters" class="sort-btn reset-btn">
                        <i class="fas fa-undo"></i>
                        Сбросить
                    </button>
                </div>
            </div>
            <div class="stats-container">
                <p id="stats"></p>
            </div>
        </section>

        <!-- Сетка с аниме -->
        <div class="anime-grid" id="anime-grid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Загрузка аниме...</p>
            </div>
        </div>

        <!-- Пагинация -->
        <div class="pagination" id="pagination">
            <button id="prev-page" class="page-btn"><i class="fas fa-chevron-left"></i></button>
            <span id="page-info">Страница 1</span>
            <button id="next-page" class="page-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </main>
</div>

<script type="module" src="main.js"></script>
</body>

</html>
